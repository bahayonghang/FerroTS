# Fixed ett-lsf-v1; change only horizon/seed/device for the formal matrix.
schema_version = 1
[data]
protocol_id = "ett-lsf-v1"
path = "data/ETT-small/ETTm1.csv"
timestamp_column = "date"
timestamp_format = "%Y-%m-%d %H:%M:%S"
interval_seconds = 900
input_columns = ["HUFL", "HULL", "MUFL", "MULL", "LUFL", "LULL", "OT"]
target_columns = ["HUFL", "HULL", "MUFL", "MULL", "LUFL", "LULL", "OT"]
time_features = "h"
[data.split]
kind = "rows"
train_end = 34560
validation_end = 46080
test_end = 57600
[window]
lookback = 96
horizon = 96
gap = 0
stride = 1
[model]
name = "dlinear"
individual = false
moving_avg = 25
[train]
seed = 2021
device = "cpu"
dtype = "f32"
batch_size = 32
accumulation_steps = 1
max_epochs = 10
patience = 3
learning_rate = 0.0001
beta1 = 0.9
beta2 = 0.999
eps = 0.00000001
weight_decay = 0.0
lr_schedule = "type1"
[output]
root = "runs"
checkpoint_history = "final"
