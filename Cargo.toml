[workspace]
members = [
    "crates/ferrots-core",
    "crates/ferrots-data",
    "crates/ferrots-nn",
    "crates/ferrots-train",
    "crates/ferrots-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
cudarc = { version = "=0.19.8", default-features = false, features = [
    "std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8",
    "cuda-version-from-build-system", "dynamic-linking",
] }
ferrots-core = { path = "crates/ferrots-core" }
ferrots-data = { path = "crates/ferrots-data" }
ferrots-nn = { path = "crates/ferrots-nn" }
ferrots-train = { path = "crates/ferrots-train" }
thiserror = "2"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "=0.8.0"
clap = { version = "4", features = ["derive"] }
